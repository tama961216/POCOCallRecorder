
name: Build POCO Call Recorder APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. 下載專案
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 設定 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. 設定 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 檢查 AndroidManifest.xml
      - name: Validate AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          print("Checking:", path)

          try:
              ET.parse(path)
              print("AndroidManifest.xml XML syntax OK")
          except ET.ParseError as e:
              print("AndroidManifest.xml XML ERROR:")
              print(e)
              raise
          PY

      # 6. 編譯 APK
      - name: Build APK
        run: gradle assembleDebug --stacktrace --info

      # 7. 確認 APK
      - name: Check APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # 8. 上傳 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCO-Call-Recorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
