
name: Build POCO Call Recorder APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build POCO Call Recorder
    runs-on: ubuntu-latest

    steps:
      # 1. 取得專案
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 設定 Android SDK
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 4. 設定 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. 檢查 Manifest
      - name: Validate AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          content = path.read_bytes()

          if content.startswith(b'\xef\xbb\xbf'):
              content = content[3:]

          content = content.lstrip(b'\r\n\t ')

          if content.startswith(b'<?xml') and content.count(b'<?xml') > 1:
              raise ValueError("Duplicate XML declaration found")

          ET.fromstring(content)

          print("AndroidManifest.xml validation PASSED")
          PY

      # 6. 編譯 APK
      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      # 7. 確認 APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          ls -lh "$APK"

      # 8. 上傳 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCO-Call-Recorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
